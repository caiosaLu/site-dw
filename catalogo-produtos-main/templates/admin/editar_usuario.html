{% extends 'admin/base.html' %}
{% block title %}Editar Usuário{% endblock %}
{% block page_title %}Editar Usuário{% endblock %}
{% block breadcrumb %}Editar usuário{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-xl-8 col-lg-10">
    <div class="card card-warning card-outline">
      <div class="card-header"><h3 class="card-title">Usuário #{{ usuario.id }}</h3></div>
      <form method="POST">
        <div class="card-body">
          <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" class="form-control" id="nome" name="nome" maxlength="50"
                   value="{{ usuario.nome }}" required>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="senha" class="form-label">Nova senha</label>
              <input type="password" class="form-control" id="senha" name="senha" autocomplete="new-password">
            </div>
            <div class="col-md-6 mb-3">
              <label for="confirmar_senha" class="form-label">Confirmar nova senha</label>
              <input type="password" class="form-control" id="confirmar_senha" name="confirmar_senha" autocomplete="new-password">
            </div>
            <div class="form-text mt-0 mb-3">Deixe em branco para manter a senha atual.</div>
          </div>
          <div class="mb-3">
            <label for="ativo" class="form-label">Status</label>
            <select class="form-select" id="ativo" name="ativo">
              <option value="True" {% if usuario.ativo|string == 'True' %}selected{% endif %}>Ativo</option>
              <option value="False" {% if usuario.ativo|string == 'False' %}selected{% endif %}>Inativo</option>
            </select>
          </div>
        </div>
        <div class="card-footer d-flex justify-content-between">
          <a href="{{ url_for('listarUsuario') }}" class="btn btn-secondary">Cancelar</a>
          <button type="submit" class="btn btn-warning"><i class="bi bi-save me-1"></i>Salvar alterações</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
