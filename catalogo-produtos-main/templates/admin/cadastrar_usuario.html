{% extends 'admin/base.html' %}
{% block title %}Cadastrar Usuário{% endblock %}
{% block page_title %}Cadastrar Usuário{% endblock %}
{% block breadcrumb %}Novo usuário{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-xl-8 col-lg-10">
    <div class="card card-primary card-outline">
      <div class="card-header"><h3 class="card-title">Dados do usuário</h3></div>
      <form method="POST">
        <div class="card-body">
          <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" class="form-control" id="nome" name="nome" maxlength="50"
                   value="{{ request.form.get('nome', '') }}" required>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="senha" class="form-label">Senha</label>
              <input type="password" class="form-control" id="senha" name="senha" required>
            </div>
            <div class="col-md-6 mb-3">
              <label for="confirmar_senha" class="form-label">Confirmar senha</label>
              <input type="password" class="form-control" id="confirmar_senha" name="confirmar_senha" required>
            </div>
          </div>
          <div class="mb-3">
            <label for="ativo" class="form-label">Status</label>
            <select class="form-select" id="ativo" name="ativo">
              <option value="True">Ativo</option>
              <option value="False" {% if request.form.get('ativo') == 'False' %}selected{% endif %}>Inativo</option>
            </select>
          </div>
        </div>
        <div class="card-footer d-flex justify-content-between">
          <a href="{{ url_for('listarUsuario') }}" class="btn btn-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Cadastrar</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
